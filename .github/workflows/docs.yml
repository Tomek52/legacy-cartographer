name: docs

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Anchors + mkdocs build --strict
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install MkDocs toolchain (pinned)
        run: pip install -r requirements-docs.txt
      - name: Check docs
        run: scripts/docs-check.sh
      # Mermaid 11.17.2 (the mermaid@11 that MkDocs Material loads) and jsdom,
      # pinned by tools/mermaid-check/package-lock.json (B-22).
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: tools/mermaid-check/package-lock.json
      - name: Install the Mermaid check (pinned)
        run: npm ci --ignore-scripts --prefix tools/mermaid-check
      - name: Module maps parse as Mermaid
        run: scripts/check-mermaid.sh
      - name: Test the docs checks themselves
        env:
          LCART_REQUIRE_MERMAID: "1"  # the Mermaid tests must run here, not skip
        run: python3 -m unittest discover -s tests/docs -v

  pages:
    # The documentation site on GitHub Pages (roadmap "Publication"), built
    # from main only. Needs Settings, Pages, Source "GitHub Actions" once;
    # without it this job fails at configure-pages and the site is not
    # published (the checks above are unaffected).
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install MkDocs toolchain (pinned)
        run: pip install -r requirements-docs.txt
      - uses: actions/configure-pages@v5
      - name: Build the site
        run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
