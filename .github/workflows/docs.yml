name: docs

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Anchors + mkdocs build --strict
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install MkDocs toolchain (pinned)
        run: pip install -r requirements-docs.txt
      - name: Check docs
        run: scripts/docs-check.sh
      - name: Test the docs checks themselves
        run: python3 -m unittest discover -s tests/docs -v
