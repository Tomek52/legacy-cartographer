name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APT_PACKAGES: ninja-build gcc-14 g++-14 clang-20 clang-tidy-20 clang-format-20 libclang-rt-20-dev llvm-20-dev libclang-20-dev libclang-cpp20-dev
  CONAN_VERSION: "2.30.0"

jobs:
  cpp:
    name: C++ ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # asan-ubsan also builds the libFuzzer targets (Clang only).
        preset: [debug, clang-debug, release, asan-ubsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $APT_PACKAGES
      - name: Install Conan
        run: pipx install "conan==${CONAN_VERSION}"
      - uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.preset }}-${{ hashFiles('conanfile.py', 'conan/profiles/*') }}
      - name: Conan dependencies
        run: scripts/conan-install.sh ${{ matrix.preset }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Fuzz (60 s per target, NFR-010)
        if: matrix.preset == 'asan-ubsan'
        run: scripts/fuzz-smoke.sh build/asan-ubsan

  cpp-system:
    # Same build from Ubuntu packages only: the offline / air-gapped path
    # (NFR-006). tsan-system runs the worker pool of ADR-0019 under
    # ThreadSanitizer (B-20).
    name: C++ ${{ matrix.preset }} (no Conan)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug-system, asan-ubsan-system, tsan-system]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq $APT_PACKAGES libsqlite3-dev nlohmann-json3-dev libtomlplusplus-dev libgtest-dev
      - name: Address space layout TSan supports
        # The runner randomises mmap with more bits than TSan's memory
        # layout allows; TSan then aborts with "unexpected memory mapping".
        if: matrix.preset == 'tsan-system'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure, build, test
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Fuzz (60 s per target, NFR-010)
        if: matrix.preset == 'asan-ubsan-system'
        run: scripts/fuzz-smoke.sh build/asan-ubsan-system
      - name: Traceability gate and matrix (B-15, ADR-0010)
        if: matrix.preset == 'debug-system'
        run: |
          python3 scripts/check-doc-anchors.py --trace build/debug-system/junit.xml --write
          git diff --exit-code -- docs/plan/traceability.md
      - name: Keep the traceability matrix
        if: matrix.preset == 'debug-system' && always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability
          path: build/traceability.csv
          if-no-files-found: ignore

  targets:
    # Analysed code bases stay pinned and unmodified (NFR-008).
    name: Targets pinned and clean
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check submodules
        run: scripts/check-targets.sh

  libmodbus:
    # B-05 and B-14: the compilation database of the pinned libmodbus (built
    # from a copy, so targets/libmodbus stays clean), then lcart analyze and
    # lcart map with no network (NFR-001 criterion 2). The committed map must
    # not change; the analysis time is the NFR-005 baseline.
    name: libmodbus baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq $APT_PACKAGES libsqlite3-dev nlohmann-json3-dev libtomlplusplus-dev libgtest-dev autoconf automake libtool make bear iproute2
      - name: Build lcart (Release)
        run: |
          cmake --preset debug-system -B build/release-system -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release-system --target lcart
      - name: Analyse libmodbus without network
        # A new network namespace has only loopback, and it starts down; bear
        # talks to its own collector over 127.0.0.1, so it is brought up.
        run: >
          sudo unshare --net -- sh -c
          'ip link set lo up && exec sudo -u "$0" env "PATH=$1"
          scripts/libmodbus-baseline.sh build/release-system/src/cli/lcart'
          "$(id -un)" "$PATH"
      - name: The committed module map is up to date
        run: git diff --exit-code -- docs/targets/libmodbus-map.md
      - name: Verifier accuracy gate
        # B-29 and ADR-0031: every labelled set (fixtures and libmodbus),
        # one combined precision; fails below the NFR-009 targets.
        # Verifies: nfr009-verifier-accuracy-measured-v1 (criterion 2),
        # b29-labelled-claim-set-v1 (criteria 2 and 3).
        run: >
          python3 scripts/claim-accuracy.py --lcart build/release-system/src/cli/lcart
          --work build/claim-accuracy --libmodbus-db build/targets/libmodbus/facts.lcart.db
          --page docs/testing/verifier-accuracy.md
      - name: The committed accuracy page is up to date
        run: git diff --exit-code -- docs/testing/verifier-accuracy.md
      - name: Keep the libmodbus build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: libmodbus-build-log
          path: build/targets/libmodbus/build.log
          if-no-files-found: ignore

  lint:
    name: Format + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq $APT_PACKAGES libsqlite3-dev nlohmann-json3-dev libtomlplusplus-dev libgtest-dev
      - name: clang-format
        run: scripts/check-format.sh
      - name: clang-tidy
        run: |
          cmake --preset debug-system
          scripts/run-clang-tidy.sh debug-system
