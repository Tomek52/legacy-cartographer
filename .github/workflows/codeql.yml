name: codeql

# The repository is public (2026-10-11), so CodeQL code scanning needs no
# GitHub Advanced Security licence. It runs on every pull request and push to
# main, and weekly to catch new queries on unchanged code. The "default
# setup" of code scanning (Settings, Code security) should stay off: GitHub
# does not accept results from both it and an advanced workflow like this.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (c-cpp)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build gcc-14 g++-14 clang-20 llvm-20-dev libclang-20-dev libclang-cpp20-dev libsqlite3-dev nlohmann-json3-dev libtomlplusplus-dev libgtest-dev
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build
        run: |
          cmake --preset debug-system
          cmake --build --preset debug-system
      - uses: github/codeql-action/analyze@v3
